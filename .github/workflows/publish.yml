# Publishes to npm when a v* tag is pushed.
#
# Exists because the version on npm drifted from the version in this repository:
# 0.1.2 shipped on 4 July, five commits of fixes landed after it, and neither
# commit that touched package.json bumped the number. Publishing by hand from a
# laptop is what allowed that, so the tag is the trigger now.
#
# The guard below is the point. It refuses to publish when the tag and
# package.json disagree, which is the exact mistake that produced two different
# builds called 0.1.2.
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm record where the tarball was built from, so consumers can
      # verify it came from this workflow rather than someone's machine.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Refuse to publish if the tag and package.json disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npm test

      - name: Refuse to publish a version that already exists
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "@heronsignal/node@$pkg" version >/dev/null 2>&1; then
            echo "::error::@heronsignal/node@$pkg is already on npm, and npm never lets a version be reused"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
